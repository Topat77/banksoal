# Tes otomatis buat tiap pull request ke main (dan tiap push ke main).
# Tiga tes jalan terpisah, hasilnya muncul di PR sebagai ✅ / ❌.
# Nggak pakai secret apa pun: tes rules pakai project bohongan "demo-banksoal",
# tes layar pakai mode coba (tanpa Firebase).
name: Tes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cepat:
    name: Tes cepat (aturan & data)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tes/aturan.tes.js

  rules:
    name: Tes rules (Firebase Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tes/rules/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Pasang firebase-tools
        run: npm install -g firebase-tools@15.34.1
      - name: Jalankan tes rules
        working-directory: tes/rules
        run: |
          npm ci
          npm run tes

  layar:
    name: Tes layar (browser, HP & laptop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tes/layar/package-lock.json
      - name: Pasang Playwright & Chromium
        working-directory: tes/layar
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Jalankan tes layar
        working-directory: tes/layar
        run: npm run tes
      - name: Screenshot kalau gagal
        if: failure()
        working-directory: tes/layar
        run: node susur.js --foto || true
      - name: Unggah screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-tes-layar
          path: tes/layar/hasil/
          if-no-files-found: ignore
          retention-days: 7
