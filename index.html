  <!-- CSP: cuma boleh muat dari domain yang dipakai aplikasi.
       gstatic: SDK Firebase & reCAPTCHA (App Check) · apis.google.com + firebaseapp.com: login Google ·
       googleapis: Firestore, Auth, App Check, AI Logic (Gemini) · fonts: huruf ·
       drive/docs: pratinjau file modul. Kalau nambah layanan baru, tambahin domainnya di sini. -->

    default-src 'self';
    script-src 'self' 'sha256-x+xp5SpBlmhWgqby6SV0mO0vft3LUtbnih1UDVdcn54=' https://www.gstatic.com https://apis.google.com https://www.google.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    img-src 'self' data: blob:;
    connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://content-firebaseappcheck.googleapis.com https://firebasevertexai.googleapis.com https://www.google.com;
    frame-src https://banksoal-pkbm.firebaseapp.com https://www.google.com https://recaptcha.google.com https://drive.google.com https://docs.google.com;
    worker-src 'self';
    manifest-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self'">
